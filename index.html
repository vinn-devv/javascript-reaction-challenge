<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reaction Challenge</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="game-container">
      <h1>Reaction Challenge</h1>

      <button class="start-btn">Start Game</button>

      <div class="game-area">
        <button class="target">CLICK ME!</button>
      </div>

      <div class="result">
        <p>Reaction: <span class="reaction-time">0</span></p>
        <p>Best: <span class="best-score">0</span></p>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
