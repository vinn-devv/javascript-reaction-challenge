<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paw Reflex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="mouse-glow"></div>

    <div class="container" aria-hidden="true">
      <div id="stars"></div>
      <div id="stars2"></div>
      <div id="stars3"></div>
    </div>

    <main class="game-container">
      <header class="game-header">
        <button class="home-btn">Home</button>

        <div class="difficulty" aria-label="Difficulty">
          <span class="difficulty-name">READY</span>
          <div class="difficulty-bars"></div>
        </div>

        <div class="header-right">
          <span class="round-counter">Round 00</span>

          <button
            class="pause-btn"
            type="button"
            aria-label="Pause game"
            disabled
          >
            Pause
          </button>
        </div>
      </header>

      <div class="stat-row">
        <div class="stat-block">
          <span class="stat-label">Last</span>
          <span class="reaction-time stat-value">—</span>
        </div>

        <div class="stat-block">
          <span class="stat-label">Score</span>
          <span class="score-value stat-value">0</span>
        </div>

        <div class="stat-block is-best">
          <span class="stat-label">Best</span>
          <span class="best-score stat-value">—</span>
        </div>
      </div>

      <div class="game-area">
        <button class="target" aria-label="Click the cat">
          <canvas class="cat-gif" width="222" height="288"></canvas>
          <video class="cat-source" autoplay loop muted playsinline>
            <source src="assets/scuba_Cat-nobg.webm" type="video/webm" />
            <source src="assets/scuba_Cat.mp4" type="video/mp4" />
          </video>
        </button>
        <p class="game-status">Ready?</p>

        <div class="combo-badge" aria-live="polite">
          <span class="combo-count"></span>
          <span class="combo-multiplier"></span>
        </div>
      </div>

      <div class="round-dots" aria-hidden="true"></div>

      <p class="mode-tag"></p>

      <button class="start-btn">Start the Round</button>
    </main>

    <section
      id="pause-screen"
      role="dialog"
      aria-modal="true"
      aria-labelledby="pause-title"
      aria-hidden="true"
    >
      <div class="pause-card">
        <p class="results-label">GAME PAUSED</p>

        <h2 id="pause-title">Taking a catnap</h2>

        <button id="resume-btn" type="button">Resume</button>
        <button id="restart-btn" type="button">Restart</button>
        <button id="pause-settings-btn" type="button">Settings</button>
        <button id="quit-btn" type="button">Quit to Home</button>
      </div>
    </section>

    <section
      id="settings-screen"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settings-title"
      aria-hidden="true"
    >
      <div class="settings-card">
        <p class="results-label">OPTIONS</p>

        <h2 id="settings-title">Settings</h2>

        <ul class="settings-list">
          <li class="setting-row">
            <div>
              <strong>Music</strong>
              <span>Home screen soundtrack</span>
            </div>
            <button
              class="toggle"
              type="button"
              role="switch"
              aria-checked="true"
              aria-label="Music"
              data-setting="music"
            >
              <span class="toggle-knob"></span>
            </button>
          </li>

          <li class="setting-row">
            <div>
              <strong>Sound effects</strong>
              <span>Clicks, hits and countdown</span>
            </div>
            <button
              class="toggle"
              type="button"
              role="switch"
              aria-checked="true"
              aria-label="Sound effects"
              data-setting="sfx"
            >
              <span class="toggle-knob"></span>
            </button>
          </li>

          <li class="setting-row">
            <div>
              <strong>Visual effects</strong>
              <span>Glow, stars and animations</span>
            </div>
            <button
              class="toggle"
              type="button"
              role="switch"
              aria-checked="true"
              aria-label="Visual effects"
              data-setting="effects"
            >
              <span class="toggle-knob"></span>
            </button>
          </li>
        </ul>

        <button id="settings-close-btn" type="button">Close</button>
      </div>
    </section>

    <section id="results-screen">
      <div class="results-card">
        <p class="results-label">GAME COMPLETE</p>

        <div class="result-reaction">
          <img id="result-gif" src="" alt="Cat reaction" />
        </div>

        <h1 id="result-title"></h1>

        <div class="result-score">
          <span>SCORE</span>
          <strong id="final-score">0</strong>
          <p class="result-streak">BEST STREAK <b id="result-streak">0</b></p>
          <p class="result-rank" id="result-rank"></p>
          <p class="result-compare" id="result-compare"></p>
        </div>

        <div class="results-stats">
          <div class="result-stat">
            <span>Average</span>
            <strong id="average-score">—</strong>
          </div>

          <div class="result-stat">
            <span>Fastest</span>
            <strong id="fastest-score">—</strong>
          </div>

          <div class="result-stat">
            <span>Accuracy</span>
            <strong id="accuracy-score">—</strong>
          </div>

          <div class="result-stat">
            <span>Best</span>
            <strong id="result-best-score">—</strong>
          </div>
        </div>

        <div class="round-breakdown" aria-label="Round breakdown"></div>

        <div class="result-achievements" id="result-achievements"></div>

        <button id="play-again-btn">Play Again</button>

        <button id="results-home-btn">Nah, I'm good</button>
      </div>
    </section>
    <script src="app.js"></script>
  </body>
</html>
