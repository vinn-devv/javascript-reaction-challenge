<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paw Reflex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="mouse-glow"></div>

    <main class="game-container">
      <section class="home-screen">
        <span
          class="paw"
          style="
            top: -4px;
            left: 18px;
            transform: rotate(-18deg);
            color: var(--pink);
          "
          aria-hidden="true"
        ></span>
        <span
          class="paw"
          style="
            bottom: 6px;
            right: 14px;
            transform: rotate(14deg);
            color: var(--signal);
          "
          aria-hidden="true"
        ></span>
        <h1>Paw Reflex</h1>
        <p class="tagline">Pounce on the cat before it wanders off.</p>

        <button class="play-btn">Enter</button>

        <p class="home-best-row">
          Fastest pounce <span class="home-best">—</span>
        </p>
      </section>

      <div id="game-loading">
        <div class="loading-logo">Paw Reflex</div>
        <div class="loading-yarn" aria-hidden="true"></div>
        <div class="loading-text">Warming up paws</div>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
