<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paw Reflex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="mouse-glow"></div>

    <div class="container">
      <div id="stars"></div>
      <div id="stars2"></div>
      <div id="stars3"></div>
      <div></div>
    </div>

    <main class="game-container">
      <button class="sound-btn" type="button" aria-label="Turn music off">
        <span class="sound-icon">♪</span>
        <span class="sound-text">ON</span>
      </button>
      <section class="home-screen">
        <span
          class="paw"
          style="
            top: -4px;
            left: 18px;
            transform: rotate(-18deg);
            color: var(--pink);
          "
          aria-hidden="true"
        ></span>

        <span
          class="paw"
          style="
            bottom: 6px;
            right: 14px;
            transform: rotate(14deg);
            color: var(--signal);
          "
          aria-hidden="true"
        ></span>

        <h1>Paw Reflex</h1>

        <p class="tagline">Let's see what those paws can do.</p>

        <div class="mode-select" role="radiogroup" aria-label="Difficulty mode">
          <button
            class="mode-btn"
            type="button"
            role="radio"
            aria-checked="false"
            data-mode="easy"
          >
            Easy
          </button>
          <button
            class="mode-btn"
            type="button"
            role="radio"
            aria-checked="true"
            data-mode="normal"
          >
            Normal
          </button>
          <button
            class="mode-btn"
            type="button"
            role="radio"
            aria-checked="false"
            data-mode="hard"
          >
            Hard
          </button>
        </div>

        <p class="mode-hint"></p>

        <button class="play-btn">Play now</button>

        <p class="home-best-row">
          Fastest reaction: <span class="home-best">—</span>
        </p>

        <button class="achievements-btn" type="button">
          Achievements <span class="achievements-count">0/8</span>
        </button>
      </section>
    </main>

    <section
      id="achievements-screen"
      role="dialog"
      aria-modal="true"
      aria-labelledby="achievements-title"
      aria-hidden="true"
    >
      <div class="achievements-card">
        <p class="results-label">TROPHIES</p>

        <h2 id="achievements-title">Achievements</h2>

        <ul class="achievements-list"></ul>

        <button id="achievements-close-btn" type="button">Close</button>
      </div>
    </section>

    <div id="game-loading">
      <div class="loading-den">
        <img
          class="loading-gif"
          src="https://media.tenor.com/aH6qp6K6lO4AAAAm/apple-apple-cat.webp"
          alt=""
          aria-hidden="true"
        />
      </div>

      <div class="loading-logo">Paw Reflex</div>

      <div class="loading-bar">
        <span></span>
      </div>

      <div class="loading-text">Warming up paws</div>
    </div>

    <audio id="home-music" loop preload="auto">
      <source src="assets/home-music.mp3" type="audio/mpeg" />
    </audio>

    <script src="app.js"></script>
  </body>
</html>
