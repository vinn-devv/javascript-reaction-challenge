<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paw Reflex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="mouse-glow"></div>

    <div class="container">
      <div id="stars"></div>
      <div id="stars2"></div>
      <div id="stars3"></div>
      <div></div>
    </div>

    <main class="game-container">
      <section class="home-screen">
        <span
          class="paw"
          style="
            top: -4px;
            left: 18px;
            transform: rotate(-18deg);
            color: var(--pink);
          "
          aria-hidden="true"
        ></span>

        <span
          class="paw"
          style="
            bottom: 6px;
            right: 14px;
            transform: rotate(14deg);
            color: var(--signal);
          "
          aria-hidden="true"
        ></span>

        <h1>Paw Reflex</h1>

        <p class="tagline">Pounce on the cat before it wanders off.</p>

        <button class="play-btn">Play now</button>

        <p class="home-best-row">
          Fastest pounce <span class="home-best">—</span>
        </p>
      </section>
    </main>

    <!-- LOADING SCREEN IS NOW OUTSIDE GAME-CONTAINER -->
    <div id="game-loading">
      <div class="loading-den">
        <img
          class="loading-gif"
          src="https://media.tenor.com/aH6qp6K6lO4AAAAm/apple-apple-cat.webp"
          alt=""
          aria-hidden="true"
        />
      </div>

      <div class="loading-logo">Paw Reflex</div>

      <div class="loading-bar">
        <span></span>
      </div>

      <div class="loading-text">Warming up paws</div>
    </div>

    <section id="results-screen">
      <div class="results-card">
        <p class="results-label">GAME COMPLETE</p>

        <h1>Nice pounce!</h1>

        <div class="results-stats">
          <div class="result-stat">
            <span>Average</span>
            <strong id="average-score">—</strong>
          </div>

          <div class="result-stat">
            <span>Fastest</span>
            <strong id="fastest-score">—</strong>
          </div>

          <div class="result-stat">
            <span>Best</span>
            <strong id="result-best-score">—</strong>
          </div>
        </div>

        <button id="play-again-btn">Play Again</button>
        <button id="results-home-btn">Home</button>
      </div>
    </section>

    <audio id="home-music" loop preload="auto">
      <source src="home-music.mp3" type="audio/mpeg" />
    </audio>

    <script src="app.js"></script>
    <script src="app.js"></script>
  </body>
</html>
